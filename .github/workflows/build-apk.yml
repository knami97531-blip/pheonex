name: Build Phoenix Assistant APK

# Builds automatically on every push, and can also be triggered manually
# from the Actions tab ("Run workflow").
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # This project's Gradle wrapper scripts (gradlew / gradlew.bat /
      # gradle-wrapper.jar) weren't included in the export, so this step
      # installs the matching Gradle version directly instead of relying on
      # ./gradlew. If you later add the wrapper files back (`gradle wrapper`
      # run once locally with Android Studio), switch this to `./gradlew`.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # If you use a Groq/Llama API key, add it as a repo secret named
      # LLAMA_API_KEY (Settings > Secrets and variables > Actions) and it
      # will be picked up here instead of being committed to source.
      - name: Build debug APK
        env:
          LLAMA_API_KEY: ${{ secrets.LLAMA_API_KEY }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-assistant-debug-apk
          path: app/build/outputs/apk/debug/*.apk
